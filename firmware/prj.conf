# --- core
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_POWEROFF=y
# math functions (sinf, atan2f...) need a full C library
CONFIG_REQUIRES_FULL_LIBC=y

# --- hardware
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_NRFX_PWM=y

# LSM6DS3TR-C (XIAO Sense): fixed ranges for best resolution, ODR set at runtime
CONFIG_LSM6DSL_ACCEL_FS=2
CONFIG_LSM6DSL_GYRO_FS=250

# --- persistent settings (zero, mount calibration, BLE bonds)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- logging over the USB-C port (only powered while plugged in)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
