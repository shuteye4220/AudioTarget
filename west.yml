# West manifest. From the folder that contains this repo:
#   west init -l AudioTarget && west update
# fetches Zephyr and
# only the modules this firmware needs.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nordic
          - mbedtls
          - tf-psa-crypto
          - picolibc
