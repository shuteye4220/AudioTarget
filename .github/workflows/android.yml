name: Phone prototype APK

# Every change to the phone app on main builds an APK with the built-in object
# models, checks it starts and runs on Android 10 and Android 15 emulators,
# and publishes it at a fixed address:
#   https://github.com/shuteye4220/AudioTarget/releases/download/android-latest/audiotarget-phone.apk
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export the built-in object models (YOLO26n, COCO)
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "ultralytics>=8.3" onnx onnxslim
          python - <<'PY'
          import shutil
          from ultralytics import YOLO
          for size, name in ((640, "coco.onnx"), (320, "coco320.onnx")):
              path = YOLO("yolo26n.pt").export(format="onnx", imgsz=size, simplify=True)
              shutil.move(path, name)
          PY
          ls -la *.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: "*.onnx"

  smoke:
    needs: models
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]   # oldest supported (Android 10) and edge-to-edge (Android 15)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: android/app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 34 && 'google_apis' || 'default' }}
          disable-animations: true
          script: gradle --no-daemon -p android connectedDebugAndroidTest

  apk:
    needs: [models, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: android/app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        run: |
          gradle --no-daemon -p android testReleaseUnitTest assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk audiotarget-phone.apk
          sha256sum audiotarget-phone.apk | tee audiotarget-phone.apk.sha256
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest audiotarget-phone.apk audiotarget-phone.apk.sha256 \
            --prerelease --target "$GITHUB_SHA" \
            --title "Phone prototype (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download audiotarget-phone.apk and install it.

          This APK includes YOLO26n object-detection models (Ultralytics, AGPL-3.0),
          trained on the COCO everyday-objects dataset. The app's source is in this repository."
